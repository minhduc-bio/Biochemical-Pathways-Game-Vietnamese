	<script>
		/* The saved theme goes on the page before the first paint, so a dark page never flashes light. app.js applies it again at start. */
		(function () {
			var theme = 'light';
			try {
				var doc = JSON.parse(window.localStorage.getItem('mg.v1') || 'null');
				var pref = doc && doc.settings ? doc.settings.theme : null;
				if (pref === 'dark' || (pref === 'auto' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)) { theme = 'dark'; }
			} catch (err) { theme = 'light'; }
			document.documentElement.setAttribute('data-theme', theme);
			if (theme === 'dark') { document.querySelector('meta[name="theme-color"]').setAttribute('content', '#282A36'); }
		})();
	</script>
